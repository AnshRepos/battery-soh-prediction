[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etm-mcp-server"
version = "0.5.0"
description = "MCP server implementation for IBM ETM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.0",
    "requests>=2.33.0",
    "pyjwt>=2.13.0",
    "starlette>=1.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["core", "services", "tools", "prompts"]

[tool.hatch.build.targets.wheel.force-include]
"etmmcpserver.py" = "etmmcpserver.py"
